# Self-hosting stack for Jellybox.
#
# Brings up:
#   - postgres   — local PostgreSQL with a named volume for persistence
#   - jellybox   — the Next.js app, built from the Dockerfile in this repo
#
# An optional Home Assistant scripts extension is included (commented out).
# Uncomment + fill in to expose HA scripts as Jellybox tag content.
#
# Quick start:
#   1. cp .env.docker.example .env
#   2. Generate AUTH_SECRET:           openssl rand -base64 32
#   3. Generate JELLYFIN_ENCRYPTION_KEY: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   4. docker compose up -d --build
#   5. Open http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jellybox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jellybox}
      POSTGRES_DB: jellybox
    volumes:
      - jellybox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellybox -d jellybox"]
      interval: 5s
      timeout: 5s
      retries: 10

  jellybox:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env
    # Compose-managed env overrides things in .env that are deployment-specific.
    # DATABASE_URL/DIRECT_URL point at the postgres service on the compose network.
    environment:
      DATABASE_URL: postgres://jellybox:${POSTGRES_PASSWORD:-jellybox}@postgres:5432/jellybox
      DIRECT_URL: postgres://jellybox:${POSTGRES_PASSWORD:-jellybox}@postgres:5432/jellybox
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${AUTH_URL:-http://localhost:3000}

  # Optional: Home Assistant scripts extension running as a sidecar on the same
  # docker network. Reachable from Jellybox at http://jellybox-ha-extension:4557.
  # Register that URL at /dashboard/settings/extensions once everything's up.
  #
  # jellybox-ha-extension:
  #   image: node:22-alpine
  #   restart: unless-stopped
  #   working_dir: /app
  #   volumes:
  #     - ./examples/extension-homeassistant:/app:ro
  #     - jellybox-ha-accounts:/data
  #   command: node server.mjs
  #   environment:
  #     PORT: 4557
  #     HOMEASSISTANT_URL: ${HOMEASSISTANT_URL}
  #     JELLYBOX_BEARER_SECRET: ${JELLYBOX_HA_BEARER_SECRET}
  #     ACCOUNTS_FILE: /data/accounts.json

  # Optional: Mosquitto MQTT broker, used to publish Home Assistant Discovery
  # so each paired Jellybox shows up in HA with sensors for "last scanned tag",
  # "last seen", and "last tag scanned at", plus a Tag-scanned event entity.
  # When this service is enabled, set in .env:
  #   MQTT_URL=mqtt://mosquitto:1883
  #   MQTT_USERNAME=jellybox
  #   MQTT_PASSWORD=<the value baked into the password file you mount below>
  # See docs/home-assistant for the password-file recipe.
  #
  # Vercel deployments don't use this service — they POST to the mqtt-bridge
  # util instead (utils/mqtt-bridge) which forwards to a Mosquitto you already
  # run alongside Home Assistant.
  #
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   restart: unless-stopped
  #   ports:
  #     # 1883 is for clients on your LAN (e.g. Home Assistant). Jellybox in
  #     # this compose talks to mosquitto on the internal docker network, so
  #     # this publish is only needed if HA lives on a different host.
  #     - "1883:1883"
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config:ro
  #     - jellybox-mosquitto-data:/mosquitto/data
  #     - jellybox-mosquitto-log:/mosquitto/log

  # Optional: forwards UDP log broadcasts from Jellybox firmware to the server's
  # /api/device-logs/ingest so admins can watch logs live in the dashboard.
  # Needs network_mode: host to receive LAN broadcasts (bridge networking
  # won't see them). Also requires DEVICE_LOGS_ENABLED=true on the jellybox
  # service and a matching DEVICE_LOGS_INGEST_TOKEN on both sides.
  #
  # jellybox-log-bridge:
  #   build: ./utils/log-bridge
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     JELLYBOX_URL: ${AUTH_URL:-http://localhost:3000}
  #     INGEST_TOKEN: ${DEVICE_LOGS_INGEST_TOKEN}
  #     # UDP_PORT: 5514
  #     # FILTER_IP: 192.168.1.42

volumes:
  jellybox-postgres:
  # jellybox-ha-accounts:
  # jellybox-mosquitto-data:
  # jellybox-mosquitto-log:
